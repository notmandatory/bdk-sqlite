[package]
name = "bdk_sqlite"
version = "0.7.0"
authors = ["Bitcoin Dev Kit Developers"]
rust-version = "1.85.0"
edition = "2024"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/bitcoindevkit/bdk-sqlite"
documentation = "https://docs.rs/bdk_sqlite"
description = "SQLite store for BDK using sqlite-thin"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
bdk_chain = { version = "0.23.3", features = ["miniscript"] }
bdk_wallet = { version = "3.0.0", optional = true }
futures-channel = { version = "0.3", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }
# `sqlite-thin` is unpublished. The crate lives in the `crates/sqlite-thin`
# member of the CDK workspace, so pin a revision and select it by package name.
# TODO: switch to a crates.io release once one exists.
sqlite-thin = { git = "https://github.com/thesimplekid/cdk", rev = "50b2688b0c0b78e55538935a795f83ad1f26c58a" }

[dev-dependencies]
anyhow = "1"
bdk_esplora = { version = "0.22.2", features = ["tokio"] }
bdk_wallet = { version = "3.2.0", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["full"] }

[dev-dependencies.bdk_sqlite]
path = "."
features = ["wallet"]

[features]
default = ["blocking", "wallet", "bundled"]
# Blocking API: `Store`, implementing `WalletPersister`.
blocking = ["dep:sha2"]
# Async API: `AsyncStore`, implementing `AsyncWalletPersister` on a worker thread.
async = ["dep:futures-channel", "dep:sha2"]
# Wallet change set support. Requires `blocking` and/or `async` to be useful.
wallet = ["dep:bdk_wallet"]
# Compile SQLite from source instead of linking the system library.
bundled = ["sqlite-thin/bundled"]

[[example]]
name = "wallet"
required-features = ["blocking", "wallet"]

[[example]]
name = "wallet_async"
required-features = ["async", "wallet"]
