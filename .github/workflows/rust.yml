name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - 1.85.0 # MSRV
          - stable
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        cache: true
    - name: Ensure sqlx is removed
      run: |
        if grep -rn -E 'sqlx::|use sqlx|sqlx *=' src examples README.md Cargo.toml; then
          echo "sqlx references found" >&2
          exit 1
        fi
    - name: Check features
      run: |
        cargo check --no-default-features
        cargo check --no-default-features --features wallet
        cargo check --no-default-features --features blocking,bundled
        cargo check --no-default-features --features async,bundled
        cargo check --no-default-features --features blocking,async,bundled
        cargo check --no-default-features --features blocking,wallet,bundled
        cargo check --no-default-features --features async,wallet,bundled
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test --no-fail-fast
    - name: Test all features
      run: cargo test --all-features --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: true
    - name: Rustfmt
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --all-targets --all-features -- -D warnings
